// PredictedArrival — emitted by trajectory prediction engine
syntax = "proto3";

package evp.v1;

message PredictedArrival {
  string event_id = 1;
  string timestamp = 2;
  int64 track_id = 3;
  string origin_junction = 4;
  
  repeated JunctionArrival predicted_arrivals = 5;
  repeated TrajectoryPoint trajectory = 6;
}

message JunctionArrival {
  string junction_id = 1;
  int32 eta_seconds = 2;
  float confidence = 3;
  string approach = 4;        // north, south, east, west
  int32 lane = 5;
}

message TrajectoryPoint {
  double lat = 1;
  double lon = 2;
  int32 t = 3;                // seconds from now
}